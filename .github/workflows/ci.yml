name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FUZZ_TOOLCHAIN: nightly-2026-08-22
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: cargo-deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  fuzz-build:
    name: Fuzz build + PR smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable action
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      - name: Cache fuzz tooling + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fuzz/target/
          key: fuzz-build-${{ runner.os }}-${{ env.FUZZ_TOOLCHAIN }}-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-build-${{ runner.os }}-${{ env.FUZZ_TOOLCHAIN }}-${{ env.CARGO_FUZZ_VERSION }}-

      - name: Install pinned cargo-fuzz
        shell: bash
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -q "cargo-fuzz $CARGO_FUZZ_VERSION"; then
            cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
          fi

      - name: Build every fuzz target
        run: cargo +${FUZZ_TOOLCHAIN} fuzz build

      - name: Fuzz smoke test every target (15 s each)
        shell: bash
        run: |
          for target in $(cargo fuzz list); do
            cargo +${FUZZ_TOOLCHAIN} fuzz run "$target" -- \
              -max_total_time=15 \
              -max_len=16384 \
              -timeout=10 \
              -rss_limit_mb=2048 \
              -print_final_stats=1
          done
