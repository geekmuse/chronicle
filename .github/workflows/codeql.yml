name: Security Audit

# CodeQL does not support Rust. This workflow uses cargo-audit (RustSec Advisory DB)
# as the equivalent SAST / dependency-vulnerability scanner for the Rust ecosystem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The tagged rustsec/audit-check action uses deprecated Node 20 and
      # publishes a redundant Checks API result that read-only Dependabot
      # tokens cannot create. The workflow job itself provides the check.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        run: cargo audit
