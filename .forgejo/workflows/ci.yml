name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FUZZ_TOOLCHAIN: nightly-2026-08-22
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  ci:
    name: CI (Linux)
    # Use 'self-hosted' if you have registered act runners; otherwise use
    # a Forgejo-hosted runner label such as 'ubuntu-latest' if available.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo-deny
        run: cargo deny check

  fuzz-build:
    name: Fuzz build + PR smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      - name: Cache fuzz tooling + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fuzz/target/
          key: fuzz-build-${{ runner.os }}-${{ env.FUZZ_TOOLCHAIN }}-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-build-${{ runner.os }}-${{ env.FUZZ_TOOLCHAIN }}-${{ env.CARGO_FUZZ_VERSION }}-

      - name: Install pinned cargo-fuzz
        shell: bash
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -q "cargo-fuzz $CARGO_FUZZ_VERSION"; then
            cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
          fi

      - name: Build every fuzz target
        run: cargo +${FUZZ_TOOLCHAIN} fuzz build

      - name: Fuzz smoke test every target (15 s each)
        shell: bash
        run: |
          for target in $(cargo fuzz list); do
            cargo +${FUZZ_TOOLCHAIN} fuzz run "$target" -- \
              -max_total_time=15 \
              -max_len=16384 \
              -timeout=10 \
              -rss_limit_mb=2048 \
              -print_final_stats=1
          done

  # Uncomment and configure if you have a self-hosted macOS runner registered
  # with Forgejo (label: macos or self-hosted,macos).
